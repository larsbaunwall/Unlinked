name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type (none: only publish the current version to the MCP Registry)"
        required: true
        default: patch
        type: choice
        options: [patch, minor, major, none]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Push commits and tags
      id-token: write # OIDC: npm trusted publishing (and provenance) and MCP Registry login

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The token is not left in .git/config for the build, test and publish steps; the push step passes it explicitly.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          # npm trusted publishing needs npm 11.5.1+, which ships with current Node 24.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Check npm supports trusted publishing
        run: |
          set -euo pipefail
          NPM_VERSION=$(npm --version)
          echo "npm $NPM_VERSION"
          printf '%s\n11.5.1\n' "$NPM_VERSION" | sort -V -C -r || { echo "::error::npm $NPM_VERSION is older than 11.5.1, which trusted publishing requires"; exit 1; }

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Bump version
        if: inputs.bump != 'none'
        run: npm version ${{ inputs.bump }} --no-git-tag-version

      - name: Sync version to server.json
        if: inputs.bump != 'none'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json

      - name: Build
        if: inputs.bump != 'none'
        run: npm run build

      - name: Test
        if: inputs.bump != 'none'
        run: npm test --if-present

      # Publish first: if npm rejects the publish, nothing has been committed, tagged or pushed.
      # Authenticated by the job's OIDC identity (npm trusted publisher), so no npm token secret is used.
      # Verbose logging shows the OIDC token exchange result when authentication fails.
      - name: Publish to npm
        if: inputs.bump != 'none'
        run: npm publish --provenance --access public --loglevel verbose

      - name: Commit, tag, and push
        if: inputs.bump != 'none'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json server.json
          git commit -m "chore: release v$VERSION"
          git tag -a "v$VERSION" -m "v$VERSION"
          AUTH=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin main --follow-tags

      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
        run: |
          set -euo pipefail
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          FILE="mcp-publisher_${OS}_${ARCH}.tar.gz"
          BASE="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl -fsSL -o "$FILE" "$BASE/$FILE"
          curl -fsSL -o checksums.txt "$BASE/registry_${MCP_PUBLISHER_VERSION#v}_checksums.txt"
          awk -v f="$FILE" '$2 == f' checksums.txt > expected.sha256
          test "$(wc -l < expected.sha256)" -eq 1
          sha256sum --check --strict expected.sha256
          tar xzf "$FILE" mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
